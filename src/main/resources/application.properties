# ---- DB（PostgreSQL）----
spring.datasource.url=${DB_URL:jdbc:postgresql://db.fdkcqpnqhvntpvxwvdyr.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:fleamarket2026}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public
spring.sql.init.continue-on-error=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Logging ----
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:DEBUG}
logging.level.root=${LOGGING_LEVEL:INFO}

# ---- SQL scripts for schema and data initialization ----
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:/schema.sql
spring.sql.init.data-locations=classpath:/data.sql

# ---- Cloudinary ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ---- Stripe ----
stripe.api.secretKey=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}

# ---- Messaging API ----
line.messaging.api.url=https://api.line.me/v2/bot/message/push
line.messaging.channel.secret=${LINE_CHANNEL_SECRET}
line.messaging.channel.access.token=${LINE_CHANNEL_ACCESS_TOKEN}