<!DOCTYPE html>
<!-- ルート要素。言語=日本語、Thymeleaf と Spring Security Dialect の xmlns を宣言 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>購入履歴</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>
	<div class="container">

		<h1>購入履歴</h1>
		<p>あなたが購入した商品の一覧です。</p>

		<!-- 購入履歴 -->
		<table>
			<thead>
				<tr>
					<th>商品名</th>
					<th>出品者</th>
					<th>価格</th>
					<th>ステータス</th>
					<th>レビュー</th>
					<th>操作</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="order : ${myOrders}">
					<!-- 商品名 -->
					<td th:text="${order.item.name}"></td>
					<!-- 出品者 -->
					<td th:text="${order.item.seller.name}"></td>
					<!-- 価格 -->
					<td th:text="${order.price != null ? '¥' + #numbers.formatDecimal(order.price, 0, 'COMMA', 0, 'POINT') : '¥' + #numbers.formatDecimal(order.item.price, 0, 'COMMA', 0, 'POINT')}"></td>
					<!-- 注文ステータス -->
					<td th:text=" ${order.status}"></td>
					<!-- レビュー -->
					<td>
						<div th:with="review=${reviewMap[order.id]}">
				            <span th:if="${review != null}">
				                <span th:each="i : ${#numbers.sequence(1, 5)}" 
				                      th:text="${i <= review.rating ? '★' : '☆'}" 
				                      style="color: #f1c40f;"></span>
				                <span th:text="${review.rating}" style="font-size: 0.9em;"></span>
				            </span>
				            <span th:unless="${review != null}" class="status-red" style="font-size: 0.8em;">
				                未投稿
				            </span>
				        </div>
				    </td>
					<!-- 詳細/レビューリンク -->
				    <td>
				        <div style="display: flex; gap: 5px;">
				            <a th:href="@{/my-page/orders/detail/{id}(id=${order.id})}" class="button small">詳細</a>
				            
							<a th:if="${reviewMap.get(order.id) == null && order.status == '発送済'}" 
							   th:href="@{/reviews/new/{id}(id=${order.id})}" 
							   class="button small">評価する</a>
				        </div>
				    </td>
				</tr>
				
				<!-- 空の場合 -->
				<tr th:if="${#lists.isEmpty(myOrders)}">
					<td colspan="6">購入した商品はありません。</td>
				</tr>
			</tbody>
		</table>
		<!-- 戻るボタン -->
		<div class="button-group">
			<a th:href="@{/my-page}" class="button secondary">
				マイページに戻る
			</a>
		</div>
	</div>
</body>

</html>
