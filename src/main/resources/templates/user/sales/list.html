<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>販売履歴 - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>
	<div class="container">

		<h1>販売履歴</h1>
		<p>あなたが販売した商品の一覧です。</p>

<!-- 販売履歴テーブル -->
		<table>
			<thead>
				<tr>
					<!-- 商品名列 -->
					<th>商品名</th>
					<!-- 購入者列 -->
					<th>購入者</th>
					<!-- 価格列 -->
					<th>価格</th>
					<!-- ステータス列 -->
					<th>ステータス</th>
					<!-- レビュー -->
					<th>レビュー</th> 
					<!-- 操作列 -->
					<th>操作</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="order : ${mySales}">
					<!-- 商品名 -->
					<td th:text="${order.item.name}"></td>
					<!-- 購入者名 -->
					<td th:text="${order.buyer.name}"></td>
					<!-- 価格 -->
					<td th:text="'¥' + ${#numbers.formatDecimal(
								order.price, 0, 'COMMA', 0,'POINT')}"></td>
					<!-- 注文ステータス -->
					<td th:text="${order.status}"></td>
					<!-- レビュー -->
					<td>
					    <div th:with="review=${reviewMap[order.id]}">
					        <span th:if="${review != null}">
					            <span th:each="i : ${#numbers.sequence(1, 5)}" 
					                  th:text="${i <= review.rating ? '★' : '☆'}" 
					                  style="color: #f1c40f;"></span>
					        </span>
					        <span th:unless="${review != null}" class="status-gray">
								未受領
							</span>
					    </div>
					</td>
					<!-- 操作セル：発送済みにするボタンを条件表示 -->
					<td>
						<div style="display: flex; gap: 5px;">
							<!-- ステータスが購入済のときのみ発送ボタンを表示 -->
							<form th:action="@{/orders/{id}/ship(id=${order.id})}" 
							            method="post" th:if="${order.status =='購入済' }">
								<!-- 送信ボタン（発送済みに更新） -->
								<button type="submit" class="button">発送済みにする</button>
							</form>
							<a th:href="@{/my-page/sales/detail/{id}(id=${order.id})}" class="button secondary small">
					            詳細
					        </a>
						</div>
					</td>
				</tr>

				<!-- データが空の場合 -->
				<tr th:if="${#lists.isEmpty(mySales)}">
					<td colspan="6">販売した商品はありません。</td>
				</tr>
			</tbody>
		</table>
		<!-- 画面下部の戻るボタン -->
		<div class="button-group">
			<a th:href="@{/my-page}" class="button secondary">マイページに戻る</a>
		</div>
	</div>
</body>

</html>
