<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>マイページ - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<style>
		/* 通知用の簡易スタイル（既存のCSSにあれば不要です） */
		.notification-area { margin-bottom: 30px; }
		.alert { padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 5px solid; }
		.alert-info { background-color: #ebf5fb; border-color: #3498db; color: #2c3e50; }
		.alert-success { background-color: #eafaf1; border-color: #2ecc71; color: #145a32; }
		.alert-warning { background-color: #fef9e7; border-color: #f1c40f; color: #7d6608; }
		.button.small { padding: 5px 10px; font-size: 0.8em; margin-left: 10px; text-decoration: none; }
	</style>
</head>


<body>
	<div class="container">

		<h1>マイページ</h1>
		<p>ようこそ、<span th:text="${user.name}"></span>さん！</p>
		
		<div class="notification-area">
					
					<div th:each="report : ${noticeReports}" class="alert alert-info">
						<p>
							<strong>【報告/お問い合わせ】</strong> 
							「<span th:text="${report.title}"></span>」への対応が完了しました。
							<a th:href="@{/reports/detail/{id}(id=${report.id})}" class="button small">内容を確認</a>
						</p>
					</div>

					<div th:each="sale : ${noticeSales}" class="alert alert-success">
						<p>
							<strong>【売上】</strong> 
							「<span th:text="${sale.item.name}"></span>」が購入されました！発送準備をしてください。
							<a th:href="@{/my-page/sales}" class="button small">発送手続きへ</a>
						</p>
					</div>

					<div th:each="order : ${noticeOrders}" class="alert alert-warning">
						<p>
							<strong>【購入】</strong> 
							「<span th:text="${order.item.name}"></span>」が発送されました！中身を確認して評価してください。
							<a th:href="@{/my-page/orders}" class="button small">受取・評価する</a>
						</p>
					</div>
					
				</div>

<!-- ナビゲーション -->
		<div class="main-nav">
			<!-- 出品管理 -->
			<a th:href="@{/my-page/selling}" class="button">出品管理</a>
			<!-- 購入履歴 -->
			<a th:href="@{/my-page/orders}" class="button">購入履歴</a>
			<!-- 販売履歴 -->
			<a th:href="@{/my-page/sales}" class="button">販売履歴</a>
			<!-- お気に入り -->
			<a th:href="@{/my-page/favorites}" class="button">お気に入り</a>
			<!-- 自分が送信した評価一覧 -->
			<a th:href="@{/my-page/reviews}" class="button">自分の評価</a>
			<!-- お問い合わせ -->
			<a th:href="@{/my-page/reports}" class="button">お問い合わせ</a>
			<!-- 商品一覧へ戻る -->
			<a th:href="@{/items}" class="button secondary">商品一覧に戻る</a>
			<!-- ログアウト -->
			<form th:action="@{/logout}" method="post" style="display:inline;">
				<button type="submit" class="button danger">ログアウト</button>
			</form>
		</div>
		
<!-- アカウント情報 -->
		<h2>アカウント情報</h2>
		<!-- 名前 -->
		<p><strong>名前:</strong> <span th:text="${user.name}"></span></p>
		<!-- メール -->
		<p><strong>メールアドレス:</strong> <span th:text="${user.email}"></span></p>
		<!-- role(不要かも) -->
		<p><strong>役割:</strong> <span th:text="${user.role}"></span></p>
	</div>
</body>

</html>
