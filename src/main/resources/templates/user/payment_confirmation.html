<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>決済確認 - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script src="https://js.stripe.com/v3/"></script>
	<meta th:name="_csrf" th:content="${_csrf.token}"/>
	<meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>


<body>
	<div class="container">

		<h1>決済確認</h1>
		<p>以下の内容で決済を完了します。</p>
		
		<div class="shipping-address-section" style="background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
		    <h3 style="margin-top: 0;">配送先の確認</h3>
		    <div id="address-display">
		        <p><strong>お届け先住所:</strong> <span id="current-address" th:text="${userAddress}">住所が読み込めません</span></p>
		        <button type="button" class="button secondary" onclick="toggleEditAddress()" style="padding: 5px 10px; font-size: 0.85em;">住所を変更する</button>
		    </div>

		    <div id="address-edit" style="display: none;">
		        <input type="text" id="new-address" class="form-control" th:value="${userAddress}" style="width: 100%; margin-bottom: 10px;">
		        <div class="button-group">
		            <button type="button" class="button" onclick="updateAddress()" style="padding: 5px 15px;">保存</button>
		            <button type="button" class="button secondary" onclick="toggleEditAddress()" style="padding: 5px 15px;">キャンセル</button>
		        </div>
		        <p id="address-error" style="color: red; font-size: 0.85em; display: none;">住所を保存できませんでした。</p>
		    </div>
		</div>
		
		<!-- Stripe Elements の描画ターゲット要素 -->
		<div id="payment-element"></div>
		<!-- 決済確定ボタン -->
		<button id="submit" class="button">決済を完了する</button>
		<!-- エラーメッセージ表示領域 -->
		<div id="payment-message" class="error-message"></div>
		<!-- 商品詳細へ戻る -->
		<div class="button-group">
			<!-- itemId パラメータで商品詳細へ戻す -->
			<a th:href="@{/items/{id}(id=${itemId})}" class="button secondary">
				商品詳細に戻る
			</a>
		</div>
	</div>
	
	<script th:inline="javascript">
		// サーバから受け取った Stripe 公開キー
		const stripePublicKey = /*[[${stripePublicKey}]]*/ "";
		// サーバサイドで作成された PaymentIntent のクライアントシークレット
		const clientSecret = /*[[${clientSecret}]]*/ "";
		// 遷移元の商品 ID（戻り導線などに活用）
		const itemId = /*[[${itemId}]]*/ "";
		// Stripe を公開キーで初期化
		const stripe = Stripe(stripePublicKey);
		// Elements をクライアントシークレット付きで生成
		const elements = stripe.elements({clientSecret});
		// 決済 UI 要素（支払いフォーム）を作成
		const paymentElement = elements.create('payment');
		// 決済 UI 要素を DOM へマウント
		paymentElement.mount('#payment-element');
		// 送信ボタン要素を取得
		const form = document.getElementById('submit');
		// エラーメッセージ表示領域を取得
		const messageContainer = document.getElementById('payment-message');
		// クリックで支払い確定処理を開始（フォーム送信ではなく JS 制御）
		form.addEventListener('click', async (e) => {
			// ボタンのデフォルト動作（フォーム送信）を止める
			e.preventDefault();
			// Stripe へ支払い確定リクエストを送る（リダイレクト不要時は XHR 内で完了）
			const {error} = await stripe.confirmPayment({
				// 作成済み Elements を指定
				elements,
				// 決済成功後の戻り URL（必要に応じてサーバ側で検証/完了処理）
				confirmParams: {
					// クライアントシークレットから PaymentIntent ID 部分を組み立てて返送（簡易実装）
					return_url: window.location.origin + 
						'/orders/complete-purchase?paymentIntentId=' + 
						clientSecret.split('_')[0] + '_' + clientSecret.split('_')[1],
				},
				// 3DS などで外部遷移が不要な場合はそのまま JS で継続
				redirect: 'if_required',
			});
			// エラーが返ってきた場合の分岐
			if (error) {
				// カードエラー or 入力検証エラーの場合は詳細を表示
				if (error.type === "card_error" || error.type === "validation_error") {
					// Stripe が示す具体的なエラーメッセージを表示
					messageContainer.textContent = error.message;
				} else {
					// 上記以外の不測のエラー
					messageContainer.textContent = "予期せぬエラーが発生しました。";
				}
			} else {
				// エラーなし＝即時成功（サーバ検証のため PaymentIntent ID で完了 API へ遷移）
				const paymentIntentId = 
					clientSecret.split('_')[0] + '_' + clientSecret.split('_')[1];
					// 完了エンドポイントへ GET 遷移（サーバで購入完了処理を実行）
					window.location.href =
						'/orders/complete-purchase?paymentIntentId=' +paymentIntentId;
			}
		});
		
		// 住所編集モードの切り替え
        function toggleEditAddress() {
            const display = document.getElementById('address-display');
            const edit = document.getElementById('address-edit');
            if (edit.style.display === 'none') {
                display.style.display = 'none';
                edit.style.display = 'block';
            } else {
                display.style.display = 'block';
                edit.style.display = 'none';
            }
        }

        // 住所を非同期でサーバーに保存
        async function updateAddress() {
            const newAddress = document.getElementById('new-address').value;
            const errorElement = document.getElementById('address-error');
			
			const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
			const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            
            if (!newAddress.trim()) {
                alert("住所を入力してください。");
                return;
            }

            try {
                const response = await fetch('/orders/api/user/update-address', {
                    method: 'POST',
                    headers: {
						 'Content-Type': 'application/json',
						 [csrfHeader]: csrfToken 
					 },
                    body: JSON.stringify({ address: newAddress })
                });

                if (response.ok) {
                    document.getElementById('current-address').textContent = newAddress;
                    toggleEditAddress();
                    errorElement.style.display = 'none';
                } else {
                    errorElement.style.display = 'block';
                }
            } catch (err) {
                console.error("Error updating address:", err);
                errorElement.style.display = 'block';
            }
        }
	</script>
</body>

</html>
