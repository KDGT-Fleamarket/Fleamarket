<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${targetUser.name} + 'さんのプロフィール'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="profile-header" style="margin-bottom: 30px; padding: 20px; border-bottom: 2px solid #eee;">
            <h1 th:text="${targetUser.name} + ' さんのショップ'"></h1>
            <div class="rating-info">
                <span th:if="${reviewCount > 0}">平均評価:
                    <span style="color: #f1c40f; font-size: 1.2em;">★</span>
                    <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)}"></strong>
                    <span th:text="' (' + ${reviewCount} + '件の評価)'" style="color: #666;"></span>
                </span>
                <span th:unless="${reviewCount > 0}" style="color: #999;">まだ評価はありません</span>
            </div>
        </div>

		<h2>すべての出品商品</h2>
        <div class="item-grid">
            <div class="item-card" th:each="item : ${items}">
                <a th:href="@{/items/{id}(id=${item.id})}">
                    <img th:src="${item.imageUrl != null ? item.imageUrl : '/images/placeholder.png'}" 
                         alt="商品画像">
                    
                    <h3 th:text="${item.name}"></h3>
                    
                    <p class="price" 
                       th:text="'¥' + ${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}">
                    </p>
                    
                    <p class="status">
                        <span th:if="${item.status == '出品中'}" th:text="${item.status}"></span>
                        <span th:if="${item.status == '決済待ち' or item.status == '購入済'}" style="color: #f39c12;">取引中</span>
                        <span th:if="${item.status == '売却済' or item.status == '発送済' or item.status == '取引完了'}" style="color: #95a5a6;">SOLD OUT</span>
                    </p>
                </a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(items)}">
            <p>出品されている商品はまだありません。</p>
        </div>
		
        <div style="margin-top: 40px;">
            <a th:href="@{/items}" class="button secondary">商品一覧に戻る</a>
        </div>
    </div>
</body>
</html>
