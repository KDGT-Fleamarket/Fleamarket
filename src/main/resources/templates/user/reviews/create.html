<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>商品評価 - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container">
		
		<h1>商品評価</h1>
		<!-- 対象商品名 / 出品者名 -->
		<p>商品「
			<!-- 対象商品名 -->			
			<span th:text="${order.item.name}"></span>
			」と出品者「
			<!-- 出品者名 -->
			<span th:text="${order.item.seller.name}"></span>
			」を評価してください。
		</p>
		<!-- エラーメッセージ -->
		<div th:if="${errorMessage}" class="error-message" 
			th:text="${errorMessage}"></div>
		
		<!-- 評価送信フォーム -->
		<form th:action="@{/reviews}" method="post">
			<!-- 対象注文 ID -->
			<input type="hidden" name="orderId" th:value="${order.id}">
			<!-- 評価点の入力行(必須) -->
			<p>
				<label for="rating">評価 (1-5):</label>
				<input type="number" id="rating" name="rating" min="1" max="5" required>
			</p>
			<!-- コメント入力行(任意) -->
			<p>
				<label for="comment">コメント (任意):</label>
				<textarea id="comment" name="comment" rows="5"></textarea>
			</p>
			<!-- ボタン -->
			<div class="button-group">
				<!-- 送信ボタン -->
				<button type="submit">評価を送信</button>
				<!-- キャンセル：購入履歴へ戻る -->
				<a th:href="@{/my-page/orders}" class="button secondary">あとで評価する</a>
			</div>
		</form>
	</div>
</body>

</html>
