<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title>管理者アカウント新規作成</title>
	    <link rel="stylesheet" th:href="@{/css/style.css}">
	</head>
	<body>
	    <div class="container">
	        <h1>管理者アカウント新規作成</h1>
	        <form th:action="@{/admin/users/create}" th:object="${user}" method="post">
	            <div>
	                <label>管理者名</label>
	                <input type="text" th:field="*{name}" required maxlength="50">
	            </div>
	            <div>
	                <label>メールアドレス</label>
	                <input type="email" th:field="*{email}" required>
	            </div>
	            <div>
	                <label>パスワード</label>
	                <input type="password" th:field="*{password}" required>
	            </div>
	            <p>付与権限: <strong>ADMIN</strong></p>
	            
	            <div class="button-group">
	                <button type="submit" class="button">作成する</button>
	                <a th:href="@{/admin/users}" class="button secondary">キャンセル</a>
	            </div>
	        </form>
	    </div>
	</body>
	</html>
