<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
	<head th:replace="~{fragments/layout :: head('ページタイトル')}"></head>
	<body>
	  <header th:insert="~{fragments/layout :: header}"></header>
	  <!-- 以降そのページ固有の内容 -->

<main class="container">
  <h1>ユーザー管理</h1>
  
  <div class="action-bar">
      <a th:href="@{/admin/users/create}" class="button primary">
          + 管理者アカウントを新規作成
      </a>
  </div>

  <form th:action="@{/admin/users}" method="get" class="filter-form">
      <input type="text" name="q" th:value="${q}" placeholder="名前・メールで検索...">
      
      <select name="role">
          <option value="">すべてのロール</option>
          <option value="USER" th:selected="${role == 'USER'}">USER</option>
          <option value="ADMIN" th:selected="${role == 'ADMIN'}">ADMIN</option>
      </select>

      <select name="banned">
          <option value="">すべての状態</option>
          <option value="false" th:selected="${banned == false}">利用可能</option>
          <option value="true" th:selected="${banned == true}">停止中(BAN)</option>
      </select>
      
      <button type="submit" class="button">検索</button>
	  <a th:href="@{/admin/users}" class="button secondary">リセット</a>
  </form>

  <table class="table">
    <thead>
      <tr><th>ID</th><th>名前</th><th>メール</th><th>ロール</th><th>有効</th><th>BAN</th><th>詳細</th></tr>
    </thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.role}"></td>
        <td th:text="${u.enabled}"></td>
        <td th:text="${u.banned}"></td>
        <td><a th:href="@{|/admin/users/${u.id}|}">詳細</a></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
