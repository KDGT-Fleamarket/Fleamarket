<!--資料P101-->
<!DOCTYPE html>
<!-- ルート要素。言語=日本語、Thymeleaf と Spring Security Dialect の xmlns を宣言 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ヘッダー領域（メタ・タイトル・スタイル） -->
<head>
	<!-- 文字コードを UTF-8 に設定 -->
	<meta charset="UTF-8">
	<!-- タイトルは商品名 + 固定文言を組み合わせて表示 -->
	<title th:text="${item.name} + '- 商品詳細'"></title>
	<!-- 共通スタイルシートを読み込み -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<!-- 画面本体 -->
<body>
	<!-- レイアウト用の中央コンテナ -->
	<div class="container">
		<!-- 商品名を大見出しに表示 -->
		<h1 th:text="${item.name}"></h1>
		<!-- エラー時メッセージ（Flash 属性など）を表示 -->
		<div th:if="${errorMessage}" class="error-message" 
			th:text="${errorMessage}"></div>
		<!-- 成功時メッセージ（Flash 属性など）を表示 -->
		<div th:if="${successMessage}" class="success-message" 
			th:text="${successMessage}"></div>
		<!-- 商品詳細領域 -->
		<div class="item-detail">
			<!-- 商品画像（なければプレースホルダ）を表示 -->
			<img th:src="${item.imageUrl != null ? 
						item.imageUrl : '/images/placeholder.png'}" 
				alt="商品画像"class="item-image">
			<!-- 価格を通貨風に整形して表示 -->
			<p class="price">価格: 
				<span th:text="'¥' + ${#numbers.formatDecimal(
							item.price, 0, 'COMMA', 0, 'POINT')}"></span>
			</p>
			<!-- 商品説明を表示 -->
			<p>説明: <span th:text="${item.description}"></span></p>
			<!-- カテゴリ名（null なら未分類）を表示 -->
			<p>カテゴリ: 
				<span th:text="${item.category != null ? 
							item.category.name : '未分類'}"></span>
			</p>
			<!-- 出品者名と平均評価がある場合は併記 -->
			<p>出品者: 
				<span th:text="${item.seller.name}"></span>		
				<!-- 平均評価がモデルに存在する場合のみ表示 -->
				<span th:if="${sellerAverageRating}">(平均評価: <span th:text="${sellerAverageRating}"></span>)</span>
			</p>
			<!-- 商品の現在ステータスを表示 -->
			<p>ステータス: <span id="item-status-display" th:text="${item.status}"></span></p>
			<!-- アクションボタン群 -->
			<div class="button-group">
				<form th:action="@{/admin/items/{id}/delete(id=${item.id})}" method="post"
				          onsubmit="return confirm('管理権限でこの商品を削除しますか？この操作は取り消せません。');">
			        <button type="submit" class="button danger">この商品を削除する</button>
			    </form>
			</div>
		</div>
		<!-- チャット見出し -->
		<h2>チャット</h2>
		<!-- チャットの表示ボックス -->
		<div class="chat-box" id="chat-messages">
			<!-- チャット履歴を時系列で描画。送信者が自分なら my-message クラスを付与 -->
			<div th:each="chat : ${chats}" class="chat-message" 
					th:classappend="${chat.sender.email == #authentication.name ? 
								'my-message' : 'other-message'}">
				<!-- 送信者名 -->
				<span class="sender-name" th:text="${chat.sender.name}"></span>
				<!-- 送信日時（yyyy/MM/dd HH:mm 形式） -->
				<span class="message-time" 
					th:text="${#temporals.format(
								chat.createdAt,'yyyy/MM/dd HH:mm')}"></span>
				<!-- メッセージ本文 -->
				<p th:text="${chat.message}"></p>
			</div>
			<!-- チャットが 1 件もない場合のメッセージ -->
			<div th:if="${#lists.isEmpty(chats)}">
				<!-- 空の旨を通知 -->
				<p>まだチャットメッセージはありません。</p>
			</div>
		</div>
		<p>※管理者はチャットの閲覧のみ可能です。</p>
		<!-- 下部の戻るボタン -->
		<div class="button-group">
			<!-- ページの戻りリンク -->
			<a href="javascript:void(0);" onclick="history.back();" class="button secondary">前のページに戻る</a>
		</div>
	</div>
	
	<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	
	<script th:inline="javascript">
	    var stompClient = null;
	    var itemId = /*[[${item.id}]]*/ 0; 
	    var currentUserEmail = /*[[${#authentication.name}]]*/ 'guest';

	    function connect() {
	        var socket = new SockJS('/ws-chat');
	        stompClient = Stomp.over(socket);
	        stompClient.connect({}, function (frame) {
	            console.log('Connected: ' + frame);
	            
	            // チャットメッセージの購読
	            stompClient.subscribe('/topic/item/' + itemId, function (messageOutput) {
	                var messageBody = JSON.parse(messageOutput.body);
	                displayNewMessage(messageBody); 
	            });

	            // ステータス更新（決済ロック）の購読
	            stompClient.subscribe('/topic/item/' + itemId + '/status', function (status) {
	                console.log("ステータス更新受信:", status.body);
	                
	                // 表示上のステータス文字（「出品中」→「決済待ち」）を書き換える
	                var statusDisplay = document.getElementById('item-status-display');
	                if (statusDisplay) {
	                    statusDisplay.innerText = status.body;
	                }
	                
	                // 購入ボタンを非表示にする（「決済待ち」または「売却済」なら消す）
	                var buyForm = document.querySelector('form[action*="initiate-purchase"]');
	                if (buyForm && (status.body === "決済待ち" || status.body === "売却済")) {
	                    buyForm.style.display = 'none';
	                }
	            });
	        });
	    }

	    function displayNewMessage(message) {
	        var chatArea = document.getElementById('chat-messages');
	        if (!chatArea) return;

	        var messageElement = document.createElement('div');
	        var isMe = (message.senderEmail === currentUserEmail);
	        messageElement.className = 'chat-message ' + (isMe ? 'my-message' : 'other-message');
	        
	        messageElement.innerHTML = 
	            '<span class="sender-name">' + (message.senderName || 'ユーザー') + '</span> ' +
	            '<span class="message-time">' + (message.createdAt || '') + '</span>' +
	            '<p>' + message.content + '</p>';
	        
	        chatArea.appendChild(messageElement);
	        chatArea.scrollTop = chatArea.scrollHeight;
	    }

	    window.onload = connect;
	</script>
</body>

</html>
