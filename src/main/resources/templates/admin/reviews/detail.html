<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>レビュー詳細 - 管理画面</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>レビュー詳細</h1>
        <div class="detail-box">
            <p><strong>ID:</strong> <span th:text="${review.id}"></span></p>
            <p><strong>商品名:</strong> <span th:text="${review.order.item.name}"></span></p>
            <p><strong>投稿者:</strong> <span th:text="${review.reviewer.name}"></span></p>
            <p><strong>対象出品者:</strong> <span th:text="${review.seller.name}"></span></p>
            <p><strong>評価:</strong> 
                <span th:each="i : ${#numbers.sequence(1, 5)}" 
                      th:text="${i <= review.rating ? '★' : '☆'}" style="color: #f1c40f;"></span>
                (<span th:text="${review.rating}"></span>)
            </p>
            <p><strong>コメント:</strong></p>
            <div class="comment-text" th:text="${review.comment}" style="white-space: pre-wrap; border: 1px solid #ddd; padding: 10px;"></div>
        </div>
        <div class="button-group">
            <a th:href="@{/admin/reviews}" class="button secondary">一覧に戻る</a>
        </div>
    </div>
</body>
</html>
