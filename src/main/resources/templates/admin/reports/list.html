<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>報告・お問い合わせ管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>お問い合わせ・報告 管理</h1>

        <div class="action-bar" style="margin-bottom: 20px;">
            <a th:href="@{/admin/dashboard}" class="button secondary">ダッシュボードに戻る</a>
        </div>
		
		<div class="search-area">
		    <form th:action="@{/admin/reports}" method="get" class="filter-form">
		        <input type="text" name="q" th:value="${q}" placeholder="メッセージ内容で検索...">
				
				<input type="number" name="reporterId" th:value="${reporterId}" placeholder="報告者ID">
		        
		        <select name="type">
		            <option value="">すべてのタイプ</option>
		            <option value="VIOLATION" th:selected="${type == 'VIOLATION'}">違反報告</option>
		            <option value="INQUIRY" th:selected="${type == 'INQUIRY'}">お問い合わせ</option>
		        </select>

		        <select name="status">
		            <option value="">すべてのステータス</option>
		            <option value="未処理" th:selected="${status == '未処理'}">未処理</option>
		            <option value="対応中" th:selected="${status == '対応中'}">対応中</option>
		            <option value="対処済" th:selected="${status == '対処済'}">対処済</option>
		            <option value="完了" th:selected="${status == '完了'}">完了</option>
		        </select>
		        
		        <button type="submit" class="button">検索</button>
		        <a th:href="@{/admin/reports}" class="button secondary">リセット</a>
		    </form>
		</div>

        <table border="1" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #f4f4f4;">
                    <th>ID</th>
                    <th>報告者</th>
                    <th>種類</th>
                    <th>内容（抜粋）</th>
                    <th>ステータス</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reports}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.reporter.name}"></td>
                    <td th:text="${r.reportType}"></td>
                    <td th:text="${#strings.abbreviate(r.message, 40)}"></td>
                    <td>
                        <span th:text="${r.status}" 
                              th:style="${r.status == '未処理' ? 'color: red; font-weight: bold;' : 'color: #333;'}">
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/admin/reports/detail/{id}(id=${r.id})}" class="button small">確認・返信</a>
                    </td>
                </tr>
				<tr th:if="${#lists.isEmpty(reports)}">
					<td colspan="6">お問い合わせ・違反報告はありません。</td>
				</tr>
            </tbody>
        </table>
    </div>
</body>
</html>
