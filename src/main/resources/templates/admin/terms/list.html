<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>利用規約管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>利用規約管理</h1>
        
        <div class="action-bar" style="margin-bottom: 20px;">
            <a th:href="@{/admin/terms/create}" class="button">＋ 新しい規約を作成</a>
            <a th:href="@{/admin/dashboard}" class="button secondary">ダッシュボードに戻る</a>
        </div>
		
		<div class="search-area">
		    <form th:action="@{/admin/terms}" method="get" class="filter-form">
		        <input type="text" name="q" th:value="${q}" placeholder="規約内容で検索...">
		        
		        <label for="date">施行日:</label>
		        <input type="date" id="date" name="date" th:value="${date}">
		        <span>以前の規約を表示</span>
		        
		        <button type="submit" class="button">検索</button>
		        <a th:href="@{/admin/terms}" class="button secondary">リセット</a>
		    </form>
		</div>

        <table border="1" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #f4f4f4;">
                    <th>Ver.</th>
                    <th>施行日</th>
                    <th>内容（抜粋）</th>
                    <th>状態</th>
					<th>操作</th>
                </tr>
            </thead>
			<tbody>
			    <tr th:each="t, iterStat : ${terms}">
			        <td th:text="${t.termsVersion}"></td>
			        <td th:text="${t.effectiveDate}"></td>
			        <td th:text="${#strings.abbreviate(t.termsContent, 50)}"></td>
			        <td>
			            <span th:if="${iterStat.first and (t.effectiveDate.isBefore(T(java.time.LocalDate).now()) || t.effectiveDate.isEqual(T(java.time.LocalDate).now()))}" 
			                  style="color: green; font-weight: bold;">施行中</span>
			            <span th:if="${!iterStat.first and (t.effectiveDate.isBefore(T(java.time.LocalDate).now()) || t.effectiveDate.isEqual(T(java.time.LocalDate).now()))}" 
			                  style="color: gray;">過去の規約</span>
			            <span th:if="${t.effectiveDate.isAfter(T(java.time.LocalDate).now())}" 
			                  style="color: blue;">予約中</span>
			        </td>
			        <td>
			            <a th:href="@{/admin/terms/detail/{id}(id=${t.termsVersion})}" class="button small">詳細</a>
			        </td>
			    </tr>
			    <tr th:if="${#lists.isEmpty(terms)}">
			        <td colspan="5">規約がありません。</td>
			    </tr>
			</tbody>
        </table>
    </div>
</body>
</html>
