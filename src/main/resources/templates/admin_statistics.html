<!DOCTYPE html>
<!-- ルート要素。日本語と Thymeleaf/Spring Security Dialect を宣言 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
	<meta charset="UTF-8">
	<title>管理者: 統計データ - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>
	<div class="container">
		
		<h1>管理者: 統計データ</h1>
		<p>フリマアプリの売上や注文に関する統計データです。</p>

<!-- フィルタ -->
		<form th:action="@{/admin/statistics}" method="get" class="filter-form">
			<!-- 開始日の入力欄 -->
			<div>
				<label for="startDate">開始日:</label>
				<input type="date" id="startDate" name="startDate" 
					th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}">
			</div>
			
			<!-- 終了日の入力欄 -->
			<div>
				<label for="endDate">終了日:</label>
				<input type="date" id="endDate" name="endDate" 
					th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}">
			</div>
			
			<!-- 確定ボタン -->
			<button type="submit" class="button">フィルタ</button>
		</form>
		
<!-- CSV エクスポートリンク -->
		<a th:href="@{/admin/statistics/csv(startDate=${startDate}, 
					endDate=${endDate})}" 
			class="button">
			CSV エクスポート
		</a>

<!-- 総売上 -->
		<h2>総売上</h2>
		<p class="price" 
			th:text="'¥' + ${#numbers.formatDecimal(totalSales, 0, 'COMMA', 0,'POINT')}"></p>

<!-- ステータス別注文数 -->
		<h2>ステータス別注文数</h2>
		<table>
			<thead>
				<tr>
					<th>ステータス</th>
					<th>注文数</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="entry : ${orderCountByStatus}">
					<!-- ステータス -->
					<td th:text="${entry.key}"></td>
					<!-- 注文数 -->
					<td th:text="${entry.value}"></td>
				</tr>
				<!-- 空の場合 -->
				<tr th:if="${#maps.isEmpty(orderCountByStatus)}">
					<td colspan="2">データがありません。</td>
				</tr>
			</tbody>
		</table>

		<!-- 戻るボタン -->
		<div class="button-group">
			<a th:href="@{/admin/dashboard}" class="button secondary">
				管理者ダッシュボードに戻る
			</a>
		</div>
	</div>
</body>

</html>
